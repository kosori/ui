name: Upstream drift

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: upstream-drift
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: 1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install the pinned toolchain
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check upstream pins
        id: drift
        continue-on-error: true
        run: |
          set -o pipefail
          bun run verify:upstream --fail-on-drift | tee drift.md

      - name: Report drift
        if: steps.drift.outcome == 'failure'
        run: |
          {
            echo '> Scheduled check of the coss/ui pins. This workflow only reports: it never edits `VERSION.md` and never opens a pull request.'
            echo
            cat drift.md
          } > body.md
          number=$(gh issue list --state open --search 'in:title "Upstream drift: coss/ui"' --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title 'Upstream drift: coss/ui' --label needs-triage --body-file body.md
          fi

      - name: Close the resolved issue
        if: steps.drift.outcome == 'success'
        run: |
          number=$(gh issue list --state open --search 'in:title "Upstream drift: coss/ui"' --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body 'The scheduled check found no drift. Closing.'
            gh issue close "$number"
          fi
